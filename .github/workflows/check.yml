name: Перевірка графіка

# Запускається ззовні: кожні 15 хв — Cloudflare Cron (worker/wrangler.toml),
# а також ботом одразу після введення нової адреси.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Причина запуску"
        required: false
        default: manual
        type: string

run-name: >-
  ${{ inputs.reason == 'cron' && 'За розкладом'
   || inputs.reason == 'address' && 'Нова адреса'
   || inputs.reason == 'deploy' && 'Після розгортання'
   || 'Вручну' }}

concurrency:
  group: check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: checker/requirements.txt

      - name: Встановити Playwright
        run: pip install -r checker/requirements.txt

      - name: Кеш браузера
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('checker/requirements.txt') }}

      - name: Встановити Chromium
        run: python -m playwright install --with-deps chromium

      - name: Перевірити графіки
        run: python checker/check.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
