name: Перевірка графіка

on:
  schedule:
    - cron: "*/10 * * * *"   # кожні 10 хв (GitHub може запізнюватись на кілька хвилин)
  workflow_dispatch:         # ручний запуск / запуск ботом після введення адреси

concurrency:
  group: check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: checker/requirements.txt

      - name: Встановити Playwright
        run: pip install -r checker/requirements.txt

      - name: Кеш браузера
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('checker/requirements.txt') }}

      - name: Встановити Chromium
        run: python -m playwright install --with-deps chromium

      - name: Перевірити графіки
        run: python checker/check.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
