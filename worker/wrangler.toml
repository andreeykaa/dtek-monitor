name = "dtek-monitor"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Як часто перевіряти графік (Cloudflare запускає перевірку на GitHub)
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dtek-monitor"
database_id = "__D1_ID__"   # підставляється автоматично під час розгортання

# Журнали в Cloudflare (Workers & Pages → dtek-monitor → Observability)
[observability]
enabled = true
